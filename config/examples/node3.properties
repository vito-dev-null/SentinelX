node.id=nodo3
node.role=WORKER
desktop.appName=SentinelX 3 — Security Operations Center — Node 3
server.port=5050
server.host=127.0.0.1
database.path=data/siem.db
rules.path=config/rules.yaml
soc.enabled=true
soc.host=127.0.0.1
soc.port=8080
worker.nodo2.url=http://node2.example.invalid:8080
soc.openBrowser=false
tls.enabled=false
tls.requireClientAuth=true
tls.keystore.path=config/certs/node3.p12
tls.keystore.password=${SENTINELX_TLS_KEYSTORE_PASSWORD}
tls.truststore.path=config/certs/node3-truststore.p12
tls.truststore.password=${SENTINELX_TLS_TRUSTSTORE_PASSWORD}
server.maxEventsPerSecond=5000
server.maxEventSizeBytes=65536
server.maxConnections=100
server.queueCapacity=10000
database.busyTimeoutMs=5000
database.walEnabled=true
soar.dryRun=true
network.enabled=false
network.interface=auto
network.captureMode=INTERFACE
network.flowTimeoutSeconds=60
network.retentionDays=30
network.metricsIntervalSeconds=1
